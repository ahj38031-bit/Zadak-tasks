<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُفكك المهام الذكي - Task Decomposer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Tajawal', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        .glass-effect {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.2);
        }
        .gradient-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            transition: all 0.3s ease;
        }
        .gradient-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px rgba(59, 130, 246, 0.3);
        }
        .step-item {
            animation: slideIn 0.3s ease-out forwards;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .loading-spinner {
            border: 3px solid rgba(148, 163, 184, 0.2);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen py-8 px-4">
    <div class="max-w-2xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-12">
            <div class="text-5xl mb-4">🧩</div>
            <h1 class="text-4xl md:text-5xl font-900 text-white mb-3">مُفكك المهام الذكي</h1>
            <p class="text-slate-400 text-lg">حول أهدافك الكبيرة إلى خطوات عملية قابلة للتنفيذ فوراً</p>
        </div>

        <!-- Main Card -->
        <div class="glass-effect rounded-2xl p-8 mb-8 shadow-2xl">
            <!-- API Key Input -->
            <div class="mb-6">
                <label class="block text-white font-700 mb-2 text-lg">مفتاح Gemini API 🔑</label>
                <input 
                    type="password" 
                    id="apiKey" 
                    placeholder="أدخل مفتاح API الخاص بك"
                    class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition"
                >
                <p class="text-slate-500 text-sm mt-2">احصل على المفتاح من <a href="https://makersuite.google.com/app/apikey" target="_blank" class="text-blue-400 hover:text-blue-300">Google AI Studio</a></p>
            </div>

            <!-- Project Name -->
            <div class="mb-6">
                <label class="block text-white font-700 mb-2 text-lg">اسم الهدف/المشروع 🎯</label>
                <input 
                    type="text" 
                    id="projectName" 
                    placeholder="مثال: إنشاء متجر إلكتروني لبيع القهوة"
                    class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition"
                >
            </div>

            <!-- Experience Level -->
            <div class="mb-6">
                <label class="block text-white font-700 mb-2 text-lg">مستوى الخبرة 📊</label>
                <select 
                    id="experienceLevel"
                    class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition"
                >
                    <option value="مبتدئ">مبتدئ</option>
                    <option value="متوسط" selected>متوسط</option>
                    <option value="خبير">خبير</option>
                </select>
            </div>

            <!-- Constraints -->
            <div class="mb-8">
                <label class="block text-white font-700 mb-2 text-lg">القيود والتفاصيل (اختياري) 💡</label>
                <textarea 
                    id="constraints" 
                    placeholder="مثال: الميزانية محدودة بـ 5000 ريال، التنفيذ خلال أسبوعين، استخدام أدوات مجانية فقط"
                    class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition resize-none h-24"
                ></textarea>
            </div>

            <!-- Submit Button -->
            <button 
                id="decomposeBtn"
                class="gradient-btn w-full py-4 rounded-lg text-white font-900 text-lg hover:shadow-lg transition flex items-center justify-center gap-2"
            >
                <span>تفكيك الهدف إلى خطوات عملية</span>
                <span>🧩</span>
            </button>
        </div>

        <!-- Results Section -->
        <div id="resultsSection" class="hidden">
            <div class="glass-effect rounded-2xl p-8 shadow-2xl">
                <h2 class="text-2xl font-900 text-white mb-6 flex items-center gap-2">
                    <span>✅</span>
                    <span>خطوات التنفيذ</span>
                </h2>

                <div id="stepsList" class="space-y-3 mb-8">
                    <!-- Steps will be inserted here -->
                </div>

                <!-- Action Buttons -->
                <div class="flex flex-col md:flex-row gap-3 mt-8">
                    <button 
                        id="copyBtn"
                        class="flex-1 py-3 rounded-lg bg-slate-700 hover:bg-slate-600 text-white font-700 transition flex items-center justify-center gap-2"
                    >
                        <span>نسخ قائمة المهام</span>
                        <span>📋</span>
                    </button>
                    <button 
                        id="printBtn"
                        class="flex-1 py-3 rounded-lg bg-slate-700 hover:bg-slate-600 text-white font-700 transition flex items-center justify-center gap-2"
                    >
                        <span>حفظ / طباعة</span>
                        <span>🖨️</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="hidden text-center">
            <div class="loading-spinner mx-auto mb-4"></div>
            <p class="text-slate-400 text-lg">جاري تفكيك الهدف...</p>
        </div>

        <!-- Error State -->
        <div id="errorState" class="hidden glass-effect rounded-2xl p-6 border-l-4 border-red-500">
            <p class="text-red-400 font-700" id="errorMessage"></p>
        </div>
    </div>

    <script>
        const decomposeBtn = document.getElementById('decomposeBtn');
        const apiKeyInput = document.getElementById('apiKey');
        const projectNameInput = document.getElementById('projectName');
        const experienceLevelSelect = document.getElementById('experienceLevel');
        const constraintsInput = document.getElementById('constraints');
        const resultsSection = document.getElementById('resultsSection');
        const loadingState = document.getElementById('loadingState');
        const errorState = document.getElementById('errorState');
        const errorMessage = document.getElementById('errorMessage');
        const stepsList = document.getElementById('stepsList');
        const copyBtn = document.getElementById('copyBtn');
        const printBtn = document.getElementById('printBtn');

        decomposeBtn.addEventListener('click', async () => {
            const apiKey = apiKeyInput.value.trim();
            const projectName = projectNameInput.value.trim();
            const experienceLevel = experienceLevelSelect.value;
            const constraints = constraintsInput.value.trim();

            if (!apiKey) {
                showError('⚠️ يرجى إدخال مفتاح Gemini API');
                return;
            }
            if (!projectName) {
                showError('⚠️ يرجى إدخال اسم الهدف/المشروع');
                return;
            }

            showLoading();
            await decompose(apiKey, projectName, experienceLevel, constraints);
        });

        async function decompose(apiKey, projectName, experienceLevel, constraints) {
            const prompt = `أنت مُفكك مهام متخصص. قم بتقسيم الهدف التالي إلى 5-8 خطوات عملية محددة جداً وقابلة للتطبيق فوراً:

الهدف: ${projectName}
مستوى الخبرة: ${experienceLevel}
${constraints ? `القيود والتفاصيل: ${constraints}` : ''}

المتطلبات:
- كل خطوة يجب أن تكون محددة وعملية وليست نظرية
- أضف الوقت المتوقع لكل خطوة بالساعات أو الأيام
- ركز على الخطوات الفورية الممكنة
- تجنب التعميمات والحديث المبالغ فيه
- رتب الخطوات بشكل منطقي من البداية إلى النهاية

الصيغة المطلوبة:
1. [العنوان] - المدة: X ساعة/يوم
   التفاصيل: [الخطوات الفرعية المحددة جداً]

2. [العنوان] - المدة: X ساعة/يوم
   التفاصيل: [الخطوات الفرعية المحددة جداً]

وهكذا...`;

            try {
                const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=' + apiKey, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: prompt
                            }]
                        }]
                    })
                });

                if (!response.ok) {
                    if (response.status === 401) {
                        showError('❌ مفتاح API غير صحيح أو منتهي الصلاحية');
                    } else if (response.status === 429) {
                        showError('❌ تم تجاوز حد الطلبات، حاول لاحقاً');
                    } else {
                        showError('❌ حدث خطأ في الاتصال بـ Gemini API');
                    }
                    return;
                }

                const data = await response.json();
                const content = data.candidates[0].content.parts[0].text;
                displayResults(content);
            } catch (error) {
                showError('❌ خطأ في الاتصال: ' + error.message);
            }
        }

        function displayResults(content) {
            resultsSection.classList.remove('hidden');
            loadingState.classList.add('hidden');
            errorState.classList.add('hidden');

            stepsList.innerHTML = '';
            const lines = content.split('\n').filter(line => line.trim());
            
            let stepIndex = 0;
            lines.forEach((line, index) => {
                const cleanLine = line.trim();
                if (cleanLine.match(/^\d+\./)) {
                    stepIndex++;
                    const stepDiv = document.createElement('div');
                    stepDiv.className = 'step-item flex gap-4 p-4 bg-slate-800/50 rounded-lg border border-slate-700 hover:border-blue-500/50 transition';
                    stepDiv.style.animationDelay = (stepIndex * 0.1) + 's';
                    
                    stepDiv.innerHTML = `
                        <input type="checkbox" class="w-5 h-5 accent-blue-500 cursor-pointer mt-1 flex-shrink-0">
                        <div class="flex-1">
                            <p class="text-white font-700 leading-relaxed">${cleanLine}</p>
                        </div>
                    `;
                    stepsList.appendChild(stepDiv);
                } else if (cleanLine && stepIndex > 0) {
                    const lastStep = stepsList.lastElementChild;
                    if (lastStep) {
                        const desc = lastStep.querySelector('div');
                        if (desc) {
                            desc.innerHTML += `<p class="text-slate-400 text-sm mt-2 leading-relaxed">${cleanLine}</p>`;
                        }
                    }
                }
            });

            window.stepsText = Array.from(stepsList.querySelectorAll('.step-item'))
                .map(item => item.textContent.replace(/^\s+|\s+$/g, ''))
                .join('\n');
        }

        copyBtn.addEventListener('click', () => {
            if (window.stepsText) {
                navigator.clipboard.writeText(window.stepsText).then(() => {
                    const originalText = copyBtn.innerHTML;
                    copyBtn.innerHTML = '<span>✓ تم النسخ</span><span>✅</span>';
                    setTimeout(() => {
                        copyBtn.innerHTML = originalText;
                    }, 2000);
                });
            }
        });

        printBtn.addEventListener('click', () => {
            const printWindow = window.open('', '', 'height=600,width=800');
            printWindow.document.write(`
                <!DOCTYPE html>
                <html dir="rtl">
                <head>
                    <meta charset="UTF-8">
